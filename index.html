<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cTrader Connection Diagnostic</title>
<style>
  body { background:#0b111b; color:#e8eef7; font-family:monospace; padding:16px; font-size:13px; }
  h2 { color:#2f9cff; font-size:16px; margin:0 0 12px; }
  #log { white-space:pre-wrap; word-break:break-all; background:#070b12; border:1px solid #273344; padding:12px; border-radius:8px; min-height:200px; max-height:70vh; overflow:auto; }
  .ok { color:#18c79a; } .err { color:#f04452; } .warn { color:#ffb347; } .info { color:#91a0b5; }
  button { background:#151f2d; color:#e8eef7; border:1px solid #2a394d; border-radius:6px; padding:8px 16px; margin-top:12px; cursor:pointer; }
</style>
</head>
<body>
<h2>cTrader Plugin Diagnostic</h2>
<div id="log">Initializing…</div>
<button id="retry">Manual Reconnect</button>

<script type="module">
import { createClientAdapter } from "https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5";
import { handleConfirmEvent, registerEvent, getLightSymbolList } from "https://esm.sh/@spotware-web-team/sdk@0.0.9";
import { take, tap, catchError, timeout } from "https://esm.sh/rxjs@7.8.2";
import { createLogger } from "https://esm.sh/@veksa/logger@1.0.6";

const logEl = document.getElementById("log");
const append = (msg, cls = "") => {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
};

let adapter = null;
let connected = false;

function connect() {
  logEl.innerHTML = "";
  connected = false;

  if (adapter) {
    try { adapter.dispose?.(); } catch (e) {}
    adapter = null;
  }

  append("Creating adapter…", "info");

  try {
    const logger = createLogger(false);
    adapter = createClientAdapter({ logger });
    append("Adapter created.", "ok");
  } catch (e) {
    append("Failed to create adapter: " + e.message, "err");
    return;
  }

  // ========== مرحله مهم که تو کد قبلی نبود ==========
  append("Sending first confirmEvent…", "info");
  handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe({
    next: () => append("First confirmEvent sent.", "ok"),
    error: (e) => append("First confirmEvent error: " + (e?.message || e), "warn")
  });

  append("Sending registerEvent (waiting for host)…", "info");

  registerEvent(adapter).pipe(
    take(1),
    timeout(8000),
    tap(() => {
      append("registerEvent response received!", "ok");

      // مرحله دوم confirm
      handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe({
        next: () => {
          connected = true;
          append("Connection confirmed successfully!", "ok");
          setTimeout(() => fetchAccountAndSymbols(), 400);
        },
        error: (e) => {
          append("Second confirmEvent failed: " + (e?.message || e), "err");
        }
      });
    }),
    catchError(err => {
      const isTimeout = err?.name === 'TimeoutError' || String(err).includes('Timeout');
      const errMsg = isTimeout
        ? "Host did not respond within 8 seconds (Timeout)."
        : (err?.message || String(err));

      append("registerEvent failed: " + errMsg, "err");
      append("Click Manual Reconnect to try again.", "warn");
      return [];
    })
  ).subscribe();
}

function fetchAccountAndSymbols() {
  if (!connected) return;

  append("Requesting account information…", "info");
  import("https://esm.sh/@spotware-web-team/sdk@0.0.9").then(sdk => {
    if (typeof sdk.getAccountInformation === "function") {
      sdk.getAccountInformation(adapter).pipe(take(1), timeout(6000)).subscribe({
        next: (res) => append("Account info: " + JSON.stringify(res, null, 2), "ok"),
        error: (e) => append("getAccountInformation failed: " + (e?.message || e), "err")
      });
    } else {
      append("getAccountInformation not available in this SDK version.", "warn");
    }
  });

  append("Requesting symbol list…", "info");
  getLightSymbolList(adapter, {}).pipe(
    take(1),
    timeout(6000),
    tap(res => {
      append("Symbols response received.", "ok");
      const raw = res?.symbol ?? res?.symbols ?? res?.result?.symbol ?? res;
      const arr = Array.isArray(raw) ? raw : [];
      append(`Parsed ${arr.length} symbols.`, arr.length ? "ok" : "warn");
      if (arr.length > 0) {
        append("First 3: " + JSON.stringify(arr.slice(0, 3), null, 2));
      }
    }),
    catchError(err => {
      append("getLightSymbolList failed: " + (err?.message || String(err)), "err");
      return [];
    })
  ).subscribe();
}

document.getElementById("retry").addEventListener("click", connect);

// شروع
connect();
</script>
</body>
</html>
