<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cTrader Plugin</title>
<style>
  body { background:#0b111b; color:#e8eef7; font-family:monospace; padding:16px; font-size:13px; }
  h2 { color:#2f9cff; margin:0 0 12px; }
  #log { white-space:pre-wrap; background:#070b12; border:1px solid #273344; padding:12px; border-radius:8px; min-height:180px; max-height:70vh; overflow:auto; }
  .ok { color:#18c79a; } .err { color:#f04452; } .info { color:#91a0b5; }
  button { background:#151f2d; color:#e8eef7; border:1px solid #2a394d; border-radius:6px; padding:8px 14px; margin-top:12px; cursor:pointer; }
</style>
</head>
<body>
<h2>cTrader Plugin Connected</h2>
<div id="log">Connecting…</div>
<button id="retry">Reconnect</button>

<script type="module">
import { createClientAdapter } from "https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5";
import { handleConfirmEvent, registerEvent, getLightSymbolList, getAccountInformation } from "https://esm.sh/@spotware-web-team/sdk@0.0.9";
import { take, timeout } from "https://esm.sh/rxjs@7.8.2";
import { createLogger } from "https://esm.sh/@veksa/logger@1.0.6";

const logEl = document.getElementById("log");
const log = (msg, cls = "info") => {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
};

let adapter = null;

function connect() {
  logEl.innerHTML = "";
  if (adapter) {
    try { adapter.dispose?.(); } catch {}
    adapter = null;
  }

  try {
    adapter = createClientAdapter({ logger: createLogger(false) });
    log("Adapter created", "ok");
  } catch (e) {
    log("Adapter failed: " + e.message, "err");
    return;
  }

  // Handshake طبق مستندات رسمی
  handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe();

  registerEvent(adapter).pipe(
    take(1),
    timeout(10000)
  ).subscribe({
    next: () => {
      handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe();
      log("Connected to cTrader successfully!", "ok");
      setTimeout(loadData, 400);
    },
    error: (e) => log("Connection failed: " + (e?.message || e), "err")
  });
}

function loadData() {
  getAccountInformation(adapter, {}).pipe(take(1), timeout(8000)).subscribe({
    next: (res) => {
      const trader = res?.payload?.Trader || res?.Trader || res;
      log("Account: " + (trader?.Name || "—") + " | Login: " + (trader?.Login || "—") + " | Balance: " + (trader?.Balance ?? "—"), "ok");
    },
    error: (e) => log("Account info error: " + (e?.message || e), "err")
  });

  getLightSymbolList(adapter, {}).pipe(take(1), timeout(8000)).subscribe({
    next: (res) => {
      const symbols = res?.payload?.Symbol || res?.Symbol || [];
      log(`Symbols loaded: ${symbols.length}`, "ok");
    },
    error: (e) => log("Symbols error: " + (e?.message || e), "err")
  });
}

document.getElementById("retry").onclick = connect;
connect();
</script>
</body>
</html>
