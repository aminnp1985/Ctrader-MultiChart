<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cTrader Connection Diagnostic (Auto-Retry)</title>
<style>
  body { background:#0b111b; color:#e8eef7; font-family:monospace; padding:16px; font-size:13px; }
  h2 { color:#2f9cff; font-size:16px; margin:0 0 12px; }
  #log { white-space:pre-wrap; word-break:break-all; background:#070b12; border:1px solid #273344; padding:12px; border-radius:8px; min-height:200px; max-height:70vh; overflow:auto; }
  .ok { color:#18c79a; } .err { color:#f04452; } .warn { color:#ffb347; } .info { color:#91a0b5; }
  button { background:#151f2d; color:#e8eef7; border:1px solid #2a394d; border-radius:6px; padding:8px 16px; margin-top:12px; cursor:pointer; }
</style>
</head>
<body>
<h2>cTrader Plugin Diagnostic (Auto-Retry Enabled)</h2>
<div id="log">Initializing…</div>
<button id="retry">Manual Reconnect</button>

<script type="module">
import { createClientAdapter } from "https://esm.sh/@spotware-web-team/sdk-external-api@0.0.5";
import { handleConfirmEvent, registerEvent, getLightSymbolList } from "https://esm.sh/@spotware-web-team/sdk@0.0.9";
import { take, tap, catchError, timeout } from "https://esm.sh/rxjs@7.8.2";
import { createLogger } from "https://esm.sh/@veksa/logger@1.0.6";

const logEl = document.getElementById("log");
const append = (msg, cls = "") => {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
};

let adapter = null;
let connected = false;
let retryCount = 0;

function connect() {
  logEl.innerHTML = "";
  connected = false;
  append(`Attempt #${retryCount + 1}: Creating adapter…`, "info");

  try {
    const logger = createLogger(false);
    adapter = createClientAdapter({ logger });
    append("Adapter created successfully.", "ok");
  } catch (e) {
    append("Failed to create adapter: " + e.message, "err");
    scheduleRetry();
    return;
  }

  append("Sending registerEvent… (Waiting for cTrader response, 5s timeout)", "info");
  
  // استفاده از timeout برای جلوگیری از گیر کردن بی‌نهایت
  registerEvent(adapter).pipe(
    take(1),
    timeout(5000), // اگر بعد از 5 ثانیه پاسخی نیامد، خطا می‌دهد
    tap(() => {
      append("registerEvent response received! Sending confirmEvent…", "ok");
      retryCount = 0; // ریست کردن شمارنده تلاش مجدد

      handleConfirmEvent(adapter, {}).pipe(take(1)).subscribe({
        next: () => {
          connected = true;
          append("Connection confirmed successfully!", "ok");
          setTimeout(() => fetchAccountAndSymbols(), 300);
        },
        error: (e) => {
          append("confirmEvent failed: " + (e?.message || e), "err");
          scheduleRetry();
        }
      });
    }),
    catchError(err => {
      // تشخیص اینکه خطا از نوع Timeout است یا خطای دیگر شبکه
      const isTimeout = err?.name === 'TimeoutError' || String(err).includes('Timeout');
      const errMsg = isTimeout ? "Server did not respond in 5 seconds (Timeout)." : (err?.message || String(err));
      
      append("registerEvent failed: " + errMsg, "err");
      append("Retrying in 3 seconds...", "warn");
      
      scheduleRetry();
      return []; // جلوگیری از خطای بیشتر
    })
  ).subscribe();
}

function scheduleRetry() {
  if (adapter) {
    try { adapter.dispose?.(); } catch (e) {}
  }
  retryCount++;
  // اگر بیش از 10 بار تلاش کرد، کمی بیشتر صبر می‌کند تا سرور فرصت ریکاوری داشته باشد
  const delay = retryCount > 10 ? 10000 : 3000; 
  setTimeout(() => connect(), delay);
}

function fetchAccountAndSymbols() {
  if (!connected) { append("Not connected yet, skipping data requests.", "warn"); return; }

  append("Step 3: Requesting account information…", "info");
  import("https://esm.sh/@spotware-web-team/sdk@0.0.9").then(sdk => {
    if (typeof sdk.getAccountInformation === "function") {
      sdk.getAccountInformation(adapter).pipe(take(1), timeout(5000)).subscribe({
        next: (res) => append("Account information: " + JSON.stringify(res, null, 2), "ok"),
        error: (e) => append("Failed to get account information: " + (e?.message || e), "err")
      });
    } else {
      append("SDK does not export getAccountInformation, skipping.", "warn");
    }
  }).catch(e => append("Dynamic SDK import failed: " + e.message, "err"));

  append("Step 4: Requesting symbol list…", "info");
  getLightSymbolList(adapter, {}).pipe(
    take(1),
    timeout(5000),
    tap(res => {
      append("Raw response: " + JSON.stringify(res).slice(0, 500), "ok");
      const raw = res?.symbol ?? res?.symbols ?? res?.result?.symbol ?? res;
      const arr = Array.isArray(raw) ? raw : [];
      append(`Parsed ${arr.length} symbols.`, arr.length ? "ok" : "warn");
      if (arr.length > 0) {
        append("First 3 symbols: " + JSON.stringify(arr.slice(0, 3), null, 2));
      }
    }),
    catchError(err => {
      append("Failed to get symbol list: " + (err?.message || String(err)), "err");
      return [];
    })
  ).subscribe();
}

document.getElementById("retry").addEventListener("click", () => {
  retryCount = 0;
  connect();
});

// شروع فرآیند
connect();
</script>
</body>
</html>
